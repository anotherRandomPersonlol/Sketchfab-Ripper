# Checks the userscript on every push and pull request: syntax, then the export tests in tests/
# (mock viewer data, GLB and FBX export, glTF validator).
name: Tests

on:
  push:
    paths-ignore:
      - '**.md'
      - docs/**
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Syntax check
        run: node --check src/Sketchfab-ripper.user.js

      - name: Translation check
        run: python tools/i18n/check_strings.py

      - name: Install test tools
        run: |
          npm install --prefix tests
          pip install -r tests/requirements.txt
          python -m playwright install --with-deps chromium

      - name: Run the tests
        run: python -m pytest tests -v
